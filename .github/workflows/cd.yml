name: CD GitOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'airport-k8s/values.yaml'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  sonar-main:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci
        working-directory: ./microservices

      - name: Run tests and generate coverage
        run: npm run test:coverage
        working-directory: ./microservices

      - name: Fix lcov paths
        run: |
          sed -i 's|SF:src\\|SF:src/|g' microservices/coverage/lcov.info
          sed -i 's|\\|/|g' microservices/coverage/lcov.info

      - name: SonarCloud scan on main
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: microservices

  docker:
    needs: sonar-main
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    outputs:
      image_tag: ${{ steps.tag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Image Tag
        id: tag
        run: |
          TAG=$(git rev-parse --short HEAD)
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: DockerHub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build \
            -t nicolascifuentesb/airport-k8s:${IMAGE_TAG} \
            -t nicolascifuentesb/airport-k8s:latest .

      - name: Push versioned image
        run: docker push nicolascifuentesb/airport-k8s:${IMAGE_TAG}

      - name: Push latest image
        run: docker push nicolascifuentesb/airport-k8s:latest

  gitops:
    needs: docker

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_GITHUB }}
          ref: main

      - name: Recover Image Tag from docker job
        run: |
          echo "IMAGE_TAG=${{ needs.docker.outputs.image_tag }}" >> $GITHUB_ENV

      - name: Update Helm values
        run: |
          sed -i "s/tag:.*/tag: ${IMAGE_TAG}/" airport-k8s/values.yaml

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add airport-k8s/values.yaml

          if git diff --cached --quiet; then
            echo "No changes detected, skipping commit"
            exit 0
          fi

          git commit -m "ci: update image tag to ${IMAGE_TAG} [skip ci]"
          git push