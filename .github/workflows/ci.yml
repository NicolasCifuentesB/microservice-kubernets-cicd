name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: microservices/coverage/lcov.info
          retention-days: 1

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check code format (Prettier)
        run: npm run format:check

      - name: Run static analysis (ESLint)
        run: npm run lint

  sonar:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: microservices/coverage

      - name: Fix lcov paths for Linux
        run: |
          sed -i 's|SF:src\\|SF:src/|g' microservices/coverage/lcov.info
          sed -i 's|\\|/|g' microservices/coverage/lcov.info

      - name: Verify coverage file
        run: |
          echo "=== First 10 lines after fix ==="
          head -10 microservices/coverage/lcov.info

      - name: SonarCloud scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: microservices

  snyk:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Snyk — dependency vulnerability scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --all-projects

      - name: Snyk — code analysis (SAST)
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: code test
          args: --severity-threshold=high

  docker-build:
    needs: [validate, lint, sonar, snyk]

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nicolascifuentesb/airport-k8s:pr-validation .