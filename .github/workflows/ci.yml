name: CI Pipeline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  validate:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm run test:coverage

      - name: Build project
        run: npm run build

  docker-build:
    needs: validate

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./microservices

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t nicolascifuentesb/airport-k8s:pr-validation .