apiVersion: v1
kind: Service

metadata:
  name: {{ .Values.appName }}-service
  labels:
    app: {{ .Values.appName }}

spec:
  selector:
    app: {{ .Values.appName }}

  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

  type: {{ .Values.service.type }}